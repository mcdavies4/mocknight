name: Android app (TWA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi
      - name: Build signed bundle and APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android bundleRelease assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mocknight-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
      # Unsigned builds (no keystore secret) are also pushed to the android-builds branch,
      # so they can be fetched and signed locally with the upload key.
      - name: Publish unsigned build to android-builds branch
        if: env.ANDROID_KEYSTORE_PATH == ''
        run: |
          mkdir -p /tmp/out && cp android/app/build/outputs/bundle/release/*.aab /tmp/out/
          cd /tmp/out
          git init -q -b android-builds
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "Unsigned build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" android-builds
